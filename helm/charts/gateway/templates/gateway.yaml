apiVersion: gateway.k8s.aws/v1beta1
kind: LoadBalancerConfiguration
metadata:
  name: {{ .Values.loadBalancerConfiguration.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  scheme: {{ .Values.loadBalancerConfiguration.scheme | quote }}
  ipAddressType: {{ .Values.loadBalancerConfiguration.ipAddressType | quote }}
  tags:
    {{- toYaml .Values.loadBalancerConfiguration.tags | nindent 4 }}
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: {{ required "acmCertificateArn is required" .Values.acmCertificateArn | quote }}
      sslPolicy: {{ .Values.loadBalancerConfiguration.sslPolicy | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.gateway.externalDnsHostnames | quote }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name | quote }}
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ .Values.loadBalancerConfiguration.name | quote }}
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: {{ .Values.gateway.hostnames.wildcard | quote }}
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-root
      hostname: {{ .Values.gateway.hostnames.root | quote }}
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
