{{- if .Values.externalSecret.enabled -}}
{{- $store := .Values.externalSecret.store -}}
{{- $storeName := $store -}}
{{- $storeKind := "ClusterSecretStore" -}}
{{- $sourceKey := dig "source" "key" "" .Values.externalSecret -}}
{{- if kindIs "map" $store -}}
{{- $storeName = $store.name -}}
{{- $storeKind = default $storeKind $store.kind -}}
{{- end -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecret.store.name or externalSecret.store is required" $storeName | quote }}
    kind: {{ $storeKind }}
  target:
    name: {{ include "backend.secretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.externalSecret.secrets }}
    - secretKey: {{ .secretKey | quote }}
      remoteRef:
        key: {{ required "externalSecret.source.key or externalSecret.secrets[].remoteKey is required" (default $sourceKey .remoteKey) | quote }}
        {{- with .property }}
        property: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
