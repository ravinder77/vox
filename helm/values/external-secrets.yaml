installCRDs: true
replicaCount: 1

serviceAccount:
  create: true
  name: external-secrets
  annotations: {}

# Webhook for validating ExternalSecret resources
webhook:
  replicaCount: 1

certController:
  replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# Metrics for Prometheus
serviceMonitor:
  enabled: true
  namespace: monitoring
  additionalLabels:
    release: voxchat-monitoring
