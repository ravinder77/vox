

replicaCount: 2

image:
  repository:
  pullPolicy: IfNotPresent
  tag: "1.0.0"

containerPort: 8080

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: "voxchat-frontend-sa"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  name: voxchat-frontend-svc
  type: ClusterIP
  port: 80

httpRoute:
  enabled: true
  # HTTPRoute annotations.
  annotations:
    external-dns.alpha.kubernetes.io/hostname: voxchat.in
  parentRefs:
    - name: voxchat-gateway
      sectionName: https-root
      namespace: voxchat
  # Hostnames matching HTTP header.
  hostnames:
    - voxchat.in
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1


# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

targetGroupConfiguration:
  enabled: true
  targetType: ip
  healthCheck:
    path: /
    port: traffic-port
    interval: 15
    timeout: 5
    healthyThresholdCount: 2
    unhealthyThresholdCount: 2
    successCodes: "200-399"
