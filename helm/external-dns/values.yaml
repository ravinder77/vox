
external-dns:
  provider: aws
  aws:
    region: ap-south-1
    zoneType: public

  domainFilters:
    - voxchat.in

  txtOwnerId: "voxchat"
  registry: txt
  policy: sync
  interval: 1m
  triggerLoopOnEvent: true
  logFormat: json

  # ← this is the key addition
  sources:
    - gateway-httproute
    - service

  serviceAccount:
    create: true
    name: external-dns
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/external-dns

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi