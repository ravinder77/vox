apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns-gateway-api
rules:
  # Read Gateway API resources
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: [gateways, httproutes, grpcroutes]
    verbs: ["get", "list", "watch"]
  # Resolve namespace selectors
  - apiGroups: [""]
    resources: [namespaces, pods, nodes, services, endpoints]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-gateway-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns-gateway-api
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns