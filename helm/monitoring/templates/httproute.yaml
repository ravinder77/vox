# ── HTTPRoute — Grafana via vox-gateway ───────────────────────────────────────
# External DNS watches this HTTPRoute and creates Route53 A record for
# grafana.voxchat.in pointing to the ALB. No annotation needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Values.externalSecret.namespace }}
  labels:
    app: grafana
    external-dns.alpha.kubernetes.io/managed: "true"
spec:
  parentRefs:
    - name: voxchat-gateway
      namespace: voxchat
      sectionName: https        # attaches to wildcard *.voxchat.in listener
  hostnames:
    - "grafana.voxchat.in"      # ExtDNS sees this and creates the Route53 record
  rules:
    - backendRefs:
        - name: vox-monitoring-grafana
          port: 80
          namespace: monitoring