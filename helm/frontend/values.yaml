

replicaCount: 1

image:
  repository:
  pullPolicy: IfNotPresent
  tag: "1.0.0"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""


podAnnotations: {}
podLabels: {}

securityContext:
   allowPrivilegeEscalation: false
   capabilities:
     drop:
     - ALL
   readOnlyRootFilesystem: true
   runAsNonRoot: true
   runAsUser: 1000

service:
  name: voxchat-frontend-svc
  type: ClusterIP
  port: 80

httpRoute:
  enabled: true
  # HTTPRoute annotations.
  annotations:
    external-dns.alpha.kubernetes.io/hostname: voxchat.in
  parentRefs:
  - name: voxchat-gateway
    sectionName: https-root
    namespace: voxchat
  # Hostnames matching HTTP header.
  hostnames:
  - voxchat.in
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

    backendRefs:
      - name: voxchat-frontend-svc
        port: 80

resources:
   limits:
     cpu: 250m
     memory: 512Mi
   requests:
     cpu: 100m
     memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http


# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
