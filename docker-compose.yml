services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxchat}
      POSTGRES_USER: ${POSTGRES_USER:-voxchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voxchat}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: deps
    command: >
      sh -c "npm run db:generate
      && npm run db:push
      && npm run db:seed
      && npm run dev"
    environment:
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-voxchat}:${POSTGRES_PASSWORD:-voxchat}@postgres:5432/${POSTGRES_DB:-voxchat}?schema=public
      JWT_SECRET: local-development-secret-change-me
      JWT_EXPIRES_IN: 7d
      COOKIE_NAME: voxchat_token
      CSRF_COOKIE_NAME: voxchat_csrf
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: deps
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-4000}/api
      VITE_CSRF_COOKIE_NAME: vox_csrf
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-node-modules:
  frontend-node-modules:
