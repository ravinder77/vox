name: "Deploy"

on:
  workflow_run:
    workflows:
      - "Docker Publish"
    types: [completed]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Defaults to this workflow SHA."
        required: false
        type: string
      apply_infra:
        description: "Run terraform apply before Kubernetes deploy."
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-vox-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install helmfile
        run: |
          curl -fsSL https://github.com/helmfile/helmfile/releases/download/v1.1.9/helmfile_1.1.9_linux_amd64.tar.gz \
            | tar -xz helmfile
          sudo mv helmfile /usr/local/bin/helmfile

      - name: Deploy
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha || github.sha }}
          SKIP_TERRAFORM_APPLY: ${{ github.event_name == 'workflow_run' && 'true' || (inputs.apply_infra == false && 'true' || 'false') }}
        run: ./scripts/deploy.sh
